services:
  - type: web
    name: docintel-genai-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: ENGINE_MODE
        value: auto
      - key: GEMINI_API_KEY
        sync: false
